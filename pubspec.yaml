name: trabekprey_downloader
description: "A Flutter Android app for downloading short drama series from Hongguo, ReelShort, KuaiKaw, MyDrama, ReelsDizim, and 8Movie."
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  share_plus: 12.0.1
  file_picker: 11.0.2
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Trabekprey.png
    - assets/Trabekprey_DL_App.png
    - assets/google_logo.png
    - assets/hongguo-logo.png
    - assets/kuaikaw-icon.png
    - assets/reelshort-logo.png
    - assets/data/iqiyi_creators_catalog.json
