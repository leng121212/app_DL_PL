name: Build & Release Trabekprey DL Pro APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename & Prepare APK
        run: |
          mkdir -p build_output
          cp build/app/outputs/flutter-apk/app-release.apk build_output/Trabekprey-DL-Pro-Release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trabekprey-DL-Pro-Release
          path: build_output/Trabekprey-DL-Pro-Release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/Trabekprey-DL-Pro-Release.apk
          generate_release_notes: true
